# Radar de Plazas · Revisión de fuentes (BOE, CIDO, TMB)
# Cada 10 minutos todo el día. La 1.ª vuelta desde las 8:00 recoge; todas confirman las plazas abiertas del CIDO;
# las siguientes leen fichas por tandas y preparan los avisos. También se puede lanzar a mano.
name: Revisa plazas

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  revisa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lanza la revisión
        run: |
          url="${{ vars.WEB_URL || 'https://radar-plazas.pages.dev' }}"
          code=$(curl -sS -m 280 -o r.json -w '%{http_code}' -X POST "$url/api/run")
          echo "Respuesta $code: $(head -c 600 r.json)"
          case "$code" in 200|429) exit 0;; *) echo "::warning::La revisión respondió $code";; esac
