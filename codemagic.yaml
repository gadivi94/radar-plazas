# Radar de Plazas · app de iPhone (Capacitor), compilada en la nube con Codemagic y subida a TestFlight.
# Pasos completos en APP-IOS.md. Se compila sola con cada cambio en main; también a mano (Start new build → «iOS (TestFlight)»).

workflows:
  ios:
    name: iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Se compila sola con cada cambio en la web o en la app (rama main); también se puede lanzar a mano.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: opos365_asc_admin   # la misma clave de App Store Connect que usas con opos365
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.radaropos.app
      vars:
        RADAR_API: https://radaropos.com
      node: 22
      xcode: latest
    scripts:
      - name: Comprobar si la app ha cambiado (si no, se para sin gastar minutos)
        script: |
          if [ -n "$CM_PREVIOUS_COMMIT" ] && [ "$CM_PREVIOUS_COMMIT" != "$CM_COMMIT" ]; then
            cambios=$(git diff --name-only "$CM_PREVIOUS_COMMIT" "$CM_COMMIT" -- web native scripts assets package.json capacitor.config.json codemagic.yaml || echo web)
            if [ -z "$cambios" ]; then echo "Sin cambios en la app: no hace falta compilar."; echo "SALTAR=1" >> $CM_ENV; exit 0; fi
            echo "$cambios" | head -20
          fi
      - name: Instalar dependencias
        script: |
          [ "$SALTAR" = "1" ] && exit 0
          npm install
      - name: Preparar la web de la app (www/)
        script: |
          [ "$SALTAR" = "1" ] && exit 0
          node scripts/prepare-www.mjs
      - name: Crear el proyecto iOS
        script: |
          [ "$SALTAR" = "1" ] && exit 0
          npx cap add ios
      - name: Icono y pantalla de inicio
        script: |
          [ "$SALTAR" = "1" ] && exit 0
          npx capacitor-assets generate --ios --iconBackgroundColor '#0d6b6b' --splashBackgroundColor '#0d6b6b' --splashBackgroundColorDark '#0d6b6b'
      - name: Sincronizar y ajustar versión, permisos y entrada con Apple
        script: |
          [ "$SALTAR" = "1" ] && exit 0
          npx cap sync ios
          node scripts/patch-native.mjs
      - name: Aplicar la firma
        script: |
          [ "$SALTAR" = "1" ] && exit 0
          xcode-project use-profiles
      - name: Compilar el IPA
        script: |
          [ "$SALTAR" = "1" ] && exit 0
          set -o pipefail
          if [ -d ios/App/App.xcworkspace ]; then T='--workspace ios/App/App.xcworkspace'; else T='--project ios/App/App.xcodeproj'; fi
          if ! xcode-project build-ipa $T --scheme "App"; then
            echo
            echo "================ MOTIVO DEL ERROR (líneas con error del registro de xcodebuild) ================"
            grep -h -E "error:|Provisioning profile|doesn't (include|support)|entitlement|No such module|Undefined symbol|Command .* failed|Signing for|is not valid|xcodebuild: error" /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -v "warning:" | sort -u | head -80
            echo "================================================================================================="
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # llega a TestFlight para pruebas internas sin revisión
