# Radar de Plazas · Cloudflare Pages (web + API en web/_worker.js)
# Lo publica GitHub Actions (.github/workflows/web.yml); no hace falta tocarlo.
name = "radar-plazas"
pages_build_output_dir = "web"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "radar-plazas-db"
database_id = "6d4af37c-e480-455a-8e52-9b9d997c3f8e"

# Workers AI: resúmenes de las bases y preguntas sobre cada plaza
[ai]
binding = "AI"

[vars]
# Fichas de detalle que se leen en cada revisión (plan gratuito: 35; de pago: hasta 300)
ENRICH_BUDGET = "45"
SITE_URL = "https://radaropos.com"
MAIL_FROM = "Radar de Plazas <avisos@radaropos.com>"
CONTACT_TO = "hola@radaropos.com"
# Alertas permitidas con la cuenta gratuita (el administrador no tiene límite)
ALERTAS_GRATIS = "3"
# Preguntas a la IA por usuario y día (cuenta gratuita)
IA_DIARIAS = "10"
# Bot de Telegram (nombre sin @). El token va como secreto TELEGRAM_BOT_TOKEN.
TELEGRAM_BOT = ""
GOOGLE_CLIENT_IDS = ""          # IDs de cliente OAuth de Google (web, iOS), separados por comas
APPLE_CLIENT_IDS = "com.radaropos.app"
